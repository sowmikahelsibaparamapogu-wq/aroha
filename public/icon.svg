<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="arohaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <rect width="512" height="512" rx="128" fill="#F8FAFC" />
  <circle cx="256" cy="256" r="220" fill="url(#arohaGrad)" />
  
  <!-- Tribal motif sunrays / rising sun -->
  <g stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.3">
    <line x1="256" y1="90" x2="256" y2="120" />
    <line x1="140" y1="140" x2="160" y2="160" />
    <line x1="372" y1="140" x2="352" y2="160" />
    <line x1="90" y1="256" x2="120" y2="256" />
    <line x1="422" y1="256" x2="392" y2="256" />
  </g>

  <!-- Central Emblem: Graduation Cap / Open Book / Tribal Tree of Knowledge -->
  <path d="M256 160 L380 220 L256 280 L132 220 Z" fill="#ffffff" />
  <path d="M380 230 L380 290 L370 295 L370 235 Z" fill="url(#coralGrad)" />
  <circle cx="370" cy="305" r="10" fill="url(#coralGrad)" />

  <!-- Open Book Base -->
  <path d="M160 300 C210 280 240 295 256 310 C272 295 302 280 352 300 L352 370 C302 350 272 365 256 380 C240 365 210 350 160 370 Z" fill="#ffffff" opacity="0.95" />
  <line x1="256" y1="310" x2="256" y2="380" stroke="#2563EB" stroke-width="5" stroke-linecap="round" />

  <!-- Tribal chevron / feather accents -->
