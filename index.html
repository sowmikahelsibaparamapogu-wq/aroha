    <script>
      // Gracefully filter benign Vite HMR websocket disconnection logs in sandboxed dev container
      (function() {
        function isViteHmrNoise(arg) {
          if (!arg) return false;
          try {
            const str = typeof arg === 'string' ? arg : (arg.message || JSON.stringify(arg) || String(arg));
            return (
              str.includes('[vite]') ||
              str.includes('vite') ||
              str.includes('vite-plugin-pwa') ||
              str.includes('failed to connect to websocket') ||
              str.includes('WebSocket connection to') ||
              str.includes('ws://') ||
              str.includes('wss://')
            );
          } catch (e) {
            return false;
          }
        }

        ['log', 'info', 'warn', 'error', 'debug'].forEach(function(method) {
          const orig = console[method];
          if (orig) {
            console[method] = function(...args) {
              if (args.some(isViteHmrNoise)) return;
              orig.apply(console, args);
            };
          }
        });

        const _RealWebSocket = window.WebSocket;
        if (_RealWebSocket) {
          window.WebSocket = function(url, protocols) {
            if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.includes('vite') || url.includes('/@vite')))) {
              return {
                addEventListener: function() {},
                removeEventListener: function() {},
                dispatchEvent: function() { return false; },
                send: function() {},
                close: function() {},
                readyState: 3,
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
              };
            }
            return new _RealWebSocket(url, protocols);
          };
          window.WebSocket.prototype = _RealWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        window.addEventListener('error', function(event) {
          if (event.message && isViteHmrNoise(event.message)) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (event.reason && isViteHmrNoise(event.reason)) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
